<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมจับคู่คำกับรูปภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7e6; --ink:#2b2a4c; --card:#ffffff; --track:#ffe2a8; --bar:#ff8a3d;
  --good:#2fb457; --good-bg:#d9f7e2; --bad:#e5484d; --bad-bg:#ffe0e1; --btn-line:#ffb300; --soft:#6b6890;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1b33; --ink:#fff4dc; --card:#2a2750; --track:#3a3665; --bar:#ffb347;
    --good:#5be584; --good-bg:#17402a; --bad:#ff7b80; --bad-bg:#4a2229; --btn-line:#ffc83d; --soft:#b5b1dd;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1b33; --ink:#fff4dc; --card:#2a2750; --track:#3a3665; --bar:#ffb347;
  --good:#5be584; --good-bg:#17402a; --bad:#ff7b80; --bad-bg:#4a2229; --btn-line:#ffc83d; --soft:#b5b1dd;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Mali","Noto Sans Thai Looped","Sarabun","Tahoma",sans-serif;font-weight:500;
  display:flex;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{width:100%;max-width:560px;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}
.track{flex:1;height:16px;background:var(--track);border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:var(--bar);border-radius:99px;transition:width .4s ease}
.pic{background:var(--card);border-radius:28px;padding:8px;box-shadow:0 6px 0 var(--track)}
.pic img{display:block;width:100%;aspect-ratio:1.36;object-fit:cover;border-radius:22px}
.ask{text-align:center;font-size:28px;font-weight:700;margin:2px 0 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{font:inherit;font-size:clamp(34px,10vw,52px);font-weight:700;color:var(--ink);background:var(--card);
  border:4px solid var(--btn-line);border-radius:24px;padding:22px 8px;cursor:pointer;box-shadow:0 6px 0 var(--btn-line);
  transition:transform .1s, box-shadow .1s;line-height:1.25;word-break:keep-all}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn-line)}
.choice:focus-visible,.go:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.choice.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 6px 0 var(--good);color:var(--good)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 6px 0 var(--bad);color:var(--bad);animation:shake .35s}
.choices.done .choice:not(.right){opacity:.45;pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:44px;text-align:center;font-size:30px;font-weight:700}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
.go{font:inherit;font-size:34px;font-weight:700;color:#fff;background:var(--good);border:0;border-radius:24px;
  padding:18px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);display:none}
.go.show{display:block}
.end{text-align:center;padding:30px 8px;display:none;flex-direction:column;gap:18px;align-items:center}
.end .big{font-size:76px;line-height:1}
.end h1{font-size:40px;margin:0}
.end p{font-size:28px;margin:0;color:var(--soft)}
.end .go{display:block;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <div id="game" style="display:contents">
    <div class="top"><span id="count">1/12</span><div class="track"><div class="bar" id="bar"></div></div></div>
    <div class="pic"><img id="img" alt="รูปภาพให้เลือกคำ"></div>
    <p class="ask">รูปนี้คืออะไร?</p>
    <div class="choices" id="choices"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <button class="go" id="next">ไปรูปต่อไป</button>
  </div>
  <div class="end" id="end">
    <div class="big">🎉</div>
    <h1>เก่งมาก!</h1>
    <p id="score"></p>
    <button class="go" id="again">เล่นอีกครั้ง</button>
  </div>
</main>

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let order, idx, mistakes, locked, missedThis;

function say(t){
  try{ if(!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(t); u.lang='th-TH'; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function beep(ok){
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=ok?784:196; g.gain.value=.08; o.connect(g); g.connect(c.destination);
    o.start(); if(ok) o.frequency.setValueAtTime(1047,c.currentTime+.12); o.stop(c.currentTime+(ok?.28:.22));
  }catch(e){}
}
function start(){
  order = shuffle(ITEMS); idx = 0; mistakes = 0;
  $('end').style.display='none'; $('game').style.display='contents'; show();
}
function show(){
  const it = order[idx]; locked=false; missedThis=false;
  $('count').textContent = (idx+1)+'/'+order.length;
  $('bar').style.width = (idx/order.length*100)+'%';
  $('img').src = it.img;
  $('msg').textContent=''; $('msg').className='msg';
  $('next').classList.remove('show');
  const wrong = shuffle(ITEMS.filter(x=>x.w!==it.w)).slice(0,3);
  const box = $('choices'); box.className='choices'; box.innerHTML='';
  shuffle([it,...wrong]).forEach(o=>{
    const b=document.createElement('button'); b.className='choice'; b.type='button'; b.textContent=o.w;
    b.onclick=()=>pick(b,o.w===it.w,it.w); box.appendChild(b);
  });
}
function pick(btn, ok, word){
  if(locked) return;
  if(ok){
    locked=true; btn.classList.add('right'); $('choices').classList.add('done');
    $('msg').textContent='ถูกต้อง! '+word; $('msg').className='msg ok';
    beep(true); say(word);
    $('next').textContent = idx===order.length-1 ? 'ดูผลคะแนน' : 'ไปรูปต่อไป';
    $('next').classList.add('show');
    $('bar').style.width = ((idx+1)/order.length*100)+'%';
  } else {
    if(!missedThis){ mistakes++; missedThis=true; }
    btn.classList.add('wrong'); btn.disabled=true;
    $('msg').textContent='ลองใหม่อีกครั้งนะ'; $('msg').className='msg no'; beep(false);
  }
}
$('next').onclick=()=>{
  if(idx===order.length-1){
    $('game').style.display='none'; $('end').style.display='flex';
    const right = order.length-mistakes;
    $('score').textContent = mistakes===0 ? 'ตอบถูกในครั้งแรกทุกข้อ!' : 'ตอบถูกในครั้งแรก '+right+' จาก '+order.length+' ข้อ';
  } else { idx++; show(); }
};
$('again').onclick=start;
start();
</script>
